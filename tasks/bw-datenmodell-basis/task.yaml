# Platzhalter: {RUN}, {MODEL}, {MCP}, {SYSTEM}, {PREFIX}, {AREA}, {PARENT_AREA}.
# Bei jeder inhaltlichen Änderung einer benutzten Fassung 'version' erhöhen.
id: bw-datenmodell-basis
version: 4
titel: InfoArea, 3 InfoObjects, aDSO, aktivieren
zeitlimit_s: 900
